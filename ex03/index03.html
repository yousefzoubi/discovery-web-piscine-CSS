<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 03 - Color Models & Opacity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="palette">

        <h2>Color Representations</h2>
        <section class="swatch-container">
            <article class="swatch named">Named Color (black)</article>
            <article class="swatch hex">HEX (#3498db)</article>
            <article class="swatch rgb">RGB (rgb(46, 204, 113))</article>
            <article class="swatch rgba">RGBA (rgba(155, 89, 182, 0.7))</article>
        </section>

        <hr>

        <h2>Opacity vs RGBA Transparency</h2>
        <section class="comparison-container">
           
            <article class="box box-opacity">
                <p>Opacity Demo: Notice how this text is ALSO 50% transparent.</p>
            </article>

            <article class="box box-rgba">
                <p>RGBA Demo: Only the background is transparent. This text remains 100% sharp!</p>
            </article>

        </section>
    </main>

</body>
</html>
