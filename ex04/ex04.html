<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 04 - The Box Model</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h2>Box Model Comparison</h2>

        <div class="box box-content">
            <h3>Content-Box</h3>
            <p>Width: 200px (+ 40px padding + 10px border = 250px Total)</p>
        </div>

        <div class="box box-border">
            <h3>Border-Box</h3>
            <p>Width: 200px (Absorbs padding and border = 200px Total)</p>
        </div>
    </main>

</body>
</html>
